<style>
/* Concepto: una columna de móvil, el dato manda. Neutros fríos, solo los tres macros llevan color
   (proteína azul, carbohidratos naranja, grasa aqua: los tres primeros tonos validados entre sí). */
:root {
  --bg: #f2f3f5; --surface: #ffffff; --surface-2: #f6f7f8;
  --text: #14161a; --text-2: #4a5059; --muted: #69707a; --line: #e0e3e8;
  --ink: #14161a; --on-ink: #ffffff; --bar-past: #bcc2ca;
  --p: #2a78d6; --c: #eb6834; --f: #1baf7a;
  --brand: #b3225f; --brand-soft: #fbe8f0; --on-brand: #ffffff;
  --shadow: 0 1px 2px rgba(20,22,26,.05), 0 10px 28px rgba(20,22,26,.07);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101113; --surface: #1a1b1d; --surface-2: #212327;
    --text: #eceef0; --text-2: #c0c5cc; --muted: #9097a1; --line: #2c2f34;
    --ink: #eceef0; --on-ink: #101113; --bar-past: #4a4f58;
    --p: #3987e5; --c: #d95926; --f: #199e70; color-scheme: dark;
    --brand: #d4457f; --brand-soft: #2d1621; --on-brand: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #101113; --surface: #1a1b1d; --surface-2: #212327;
  --text: #eceef0; --text-2: #c0c5cc; --muted: #9097a1; --line: #2c2f34;
  --ink: #eceef0; --on-ink: #101113; --bar-past: #4a4f58;
  --p: #3987e5; --c: #d95926; --f: #199e70; color-scheme: dark;
    --brand: #d4457f; --brand-soft: #2d1621; --on-brand: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px; -webkit-text-size-adjust: 100%;
}
#app { max-width: 480px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.15rem; } h3 { font-size: 1rem; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .t2 { color: var(--text-2); }
.small { font-size: .85rem; } .tiny { font-size: .78rem; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.wrap { flex-wrap: wrap; }
.label { font-size: .84rem; color: var(--text-2); font-weight: 600; }

/* cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 14px 0 10px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
.iconbtn { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 50%; padding: 0; }
.iconbtn:disabled { opacity: .35; cursor: default; }
.iconbtn svg { width: 20px; height: 20px; }
.date { text-align: center; line-height: 1.2; }
.date b { font-family: var(--display); font-size: 1.15rem; display: block; text-transform: capitalize; }

/* secciones */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.banner { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: .9rem; }
.banner button { margin-top: 8px; }
.warn { border-color: var(--text-2); }

/* cifra principal */
.hero { padding: 4px 0 2px; }
.hero .big { font-family: var(--display); font-weight: 700; font-size: 3.6rem; line-height: 1; letter-spacing: -.02em; }
.hero .unit { font-size: 1rem; font-weight: 500; color: var(--text-2); margin-left: 6px; letter-spacing: 0; }
.hero-meta { margin-top: 6px; color: var(--text-2); font-size: .95rem; }

/* medidores */
.meter { height: 10px; border-radius: 5px; background: color-mix(in srgb, var(--mc, var(--ink)) 16%, var(--surface)); position: relative; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--mc, var(--ink)); border-radius: 0 5px 5px 0; min-width: 0; }
.meter.over::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 3px; background: var(--surface); }
.hero .meter { height: 12px; margin-top: 14px; --mc: var(--ink); }
.macro { display: grid; gap: 6px; }
.macro .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; background: var(--mc); }
.macro b { font-weight: 600; }
.mP { --mc: var(--p); } .mC { --mc: var(--c); } .mF { --mc: var(--f); }

/* botones y controles */
.btn { border: 0; border-radius: 12px; padding: 13px 18px; font-weight: 600; background: var(--brand); color: var(--on-brand); min-height: 48px; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn.small { min-height: 40px; padding: 8px 14px; font-size: .9rem; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .4; cursor: default; }
.link { background: none; border: 0; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.field { display: grid; gap: 6px; }
.field > span { font-size: .85rem; color: var(--text-2); font-weight: 500; }
input[type=text], input[type=search], input[type=number], input[type=tel], select {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 48px; font-size: 16px; }
input:focus-visible, select:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; padding: 10px 6px; border-radius: 9px; font-weight: 500; min-height: 42px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); font-weight: 600; }
textarea { font: inherit; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 16px; color: inherit; resize: vertical; min-height: 96px; }
textarea:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
.wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.wk button { background: none; border: 0; display: grid; justify-items: center; gap: 4px; padding: 6px 0; border-radius: 12px; min-height: 64px; }
.wk .dn { font-size: .72rem; color: var(--muted); text-transform: uppercase; }
.wk .dd { font-weight: 600; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; }
.wk button[aria-current="date"] .dd { background: var(--brand); color: var(--on-brand); }
.wk .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); }
.wk .dot.in { background: var(--brand); border-color: var(--brand); }
.wk .dot.out { border-color: var(--brand); }
.wk button:disabled { opacity: .35; cursor: default; }
.streak { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .85rem; background: var(--brand-soft); color: var(--brand); padding: 5px 11px; border-radius: 999px; }
.streak svg { width: 16px; height: 16px; }
.wrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.wrow input[type=text] { min-height: 42px; padding: 6px 10px; width: 84px; }
.wrow input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--ink); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; min-height: 40px; font-weight: 500; }
.chips.four { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.chips.four .chip { padding: 8px 2px; text-align: center; font-size: .92rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.err { color: var(--text); background: var(--surface-2); border: 1px solid var(--text-2); border-radius: 12px; padding: 12px 14px; font-size: .92rem; }
.pill { font-size: .72rem; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; color: var(--text-2); white-space: nowrap; }

/* lista de registro (v2) */

/* gráfico semanal */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 120px; position: relative; padding-top: 6px; }
.wcol { background: none; border: 0; padding: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; }
.wbar { width: min(24px, 70%); border-radius: 4px 4px 0 0; background: var(--bar-past); min-height: 2px; }
.wcol.today .wbar { background: var(--brand); }
.wcol[aria-pressed="true"] .wbar { outline: 2px solid var(--text); outline-offset: 2px; }
.wlab { font-size: .72rem; color: var(--muted); text-transform: capitalize; }
.wgoal { position: absolute; left: 0; right: 0; border-top: 1px solid var(--muted); pointer-events: none; }
.wgoal span { position: absolute; right: 0; top: -18px; font-size: .72rem; color: var(--muted); background: var(--surface); padding-left: 4px; }

/* sugerencias */
.sugg { display: grid; gap: 12px; }
.sugg .items { display: grid; gap: 6px; }
.sugg .it { display: flex; gap: 10px; align-items: baseline; }
.sugg .it b { font-family: var(--display); font-size: 1.1rem; }
.mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.mini div { background: var(--surface-2); border-radius: 10px; padding: 8px; }
.mini b { display: block; font-size: .95rem; }
.mini span { font-size: .72rem; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper b { font-family: var(--display); font-size: 1.4rem; min-width: 1.5ch; text-align: center; }

/* hoja de agregar */
.sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-in { max-width: 480px; margin: 0 auto; display: grid; gap: 16px; padding-top: 14px; }
.results { display: grid; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.results button { text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 14px; display: flex; justify-content: space-between; gap: 12px; min-height: 52px; align-items: center; }
.results button:first-child { border-top: 0; }
.results .nm { overflow-wrap: anywhere; }
.preview { display: grid; gap: 10px; }
.method { display: grid; gap: 8px; }
.method button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; }
.method button[aria-pressed="true"] { border: 2px solid var(--text); padding: 9px 11px; }
.method b { font-weight: 600; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--on-ink); padding: 10px 16px; border-radius: 12px; z-index: 40; max-width: calc(100% - 32px); font-size: .92rem; }

/* barra inferior */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 94%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tab { background: none; border: 0; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; color: var(--muted); font-size: .72rem; font-weight: 600; min-height: 52px; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--brand); }
.tab.add { color: var(--on-ink); }
.tab.add span.pl { background: var(--brand); width: 52px; height: 52px; margin-top: -22px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 6px 16px color-mix(in srgb, var(--brand) 38%, transparent); }
.tab.add { color: var(--text); }
.tab.add svg { color: var(--on-brand); width: 24px; height: 24px; }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 0; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; text-align: right; font-weight: 600; }
details summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .meter i, .wbar { transition: width .35s ease, height .35s ease; } }
.rec summary{cursor:pointer;font-weight:600;padding:8px 0;min-height:44px;display:flex;align-items:center}
.rec ol{margin:4px 0 8px;padding-left:22px}.rec li{margin:6px 0}

/* ---- v2: estructura de la pantalla Hoy ---- */
.hero-card { padding: 18px; display: grid; gap: 16px; box-shadow: var(--shadow); border-radius: 24px; }
.hero-top { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.ringbox { position: relative; width: 148px; height: 148px; }
.ring { width: 100%; height: 100%; display: block; }
.ring-track { stroke: color-mix(in srgb, var(--brand) 14%, var(--surface)); }
.ring-arc { stroke: var(--brand); }
.ring-center { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; text-align: center; line-height: 1.15; padding: 0 20px; }
.ring-center .cap { font-size: .8rem; color: var(--text-2); }
.ring-center .big { font-family: var(--display); font-weight: 700; font-size: 2rem; letter-spacing: -.02em; line-height: 1.05; }
.stats { margin: 0; display: grid; gap: 10px; min-width: 0; }
.stats > div { display: grid; gap: 1px; }
.stats dt { font-size: .8rem; color: var(--muted); }
.stats dd { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.2rem; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.stats dd small { font-family: var(--body); font-weight: 500; font-size: .8rem; color: var(--text-2); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface-2); border-radius: 14px; padding: 12px 10px 10px; display: grid; gap: 7px; min-width: 0; align-content: start; }
.tile .tl { display: flex; align-items: center; font-size: .84rem; font-weight: 600; }
.tile .tl .key { margin-right: 6px; flex: none; }
.tile .tv { font-size: .8rem; color: var(--muted); white-space: nowrap; }
.tile .tv b { font-family: var(--display); font-size: 1.4rem; color: var(--text); font-weight: 700; }
.tile .meter { height: 6px; border-radius: 3px; }
.tile .meter i { border-radius: 0 3px 3px 0; }
.tile .tn { font-size: .78rem; color: var(--text-2); }
.acc summary { font-weight: 500; font-size: .88rem; color: var(--text-2); padding: 2px 0; }
.acc .kv { margin-top: 8px; }
.acc p { margin-top: 8px; }
.hero-actions { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; }

.meals { padding: 6px 16px; }
.meal { display: block; padding: 12px 0; border-top: 1px solid var(--line); }
.meal:first-of-type { border-top: 0; }
.meal-head { display: flex; align-items: center; gap: 12px; }
.meal-ico { width: 38px; height: 38px; border-radius: 12px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; flex: none; }
.meal-ico svg { width: 20px; height: 20px; }
.meal-head .mt { flex: 1; min-width: 0; line-height: 1.2; }
.meal-head .mt h3 { font-size: 1.02rem; }
.meal-head .mt span { font-size: .8rem; color: var(--muted); }
.meal-head .mk { font-family: var(--display); font-weight: 700; font-size: 1.05rem; }
.meal-head .mk small { font-family: var(--body); font-weight: 500; color: var(--muted); font-size: .76rem; margin-left: 3px; }
.addmini { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; padding: 0; flex: none; }
.addmini svg { width: 18px; height: 18px; }
.entry { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; padding: 10px 0 2px 50px; align-items: start; }
.entry .nm { font-weight: 500; overflow-wrap: anywhere; line-height: 1.3; }
.e-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: .8rem; color: var(--text-2); margin-top: 4px; }
.ml { display: inline-flex; align-items: center; gap: 4px; }
.ml .key { margin: 0; width: 8px; height: 8px; border-radius: 50%; }
.e-side { display: flex; align-items: center; gap: 2px; }
.e-side .kc { font-weight: 600; text-align: right; min-width: 3.2ch; }
.e-side .kc small { font-weight: 500; color: var(--muted); font-size: .74rem; margin-left: 2px; }
.xbtn { background: none; border: 0; color: var(--muted); width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border-radius: 50%; }
.xbtn svg { width: 18px; height: 18px; }
.xbtn.sure { width: auto; padding: 0 12px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-weight: 600; font-size: .82rem; }
.empty { padding: 4px 0 0 50px; color: var(--muted); font-size: .9rem; }

/* ---- v2: buscador ---- */
.sheet-head { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 6px 0 8px; }
.searchbox { position: relative; }
.searchbox > svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.searchbox input { padding-left: 44px; }
.gchips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.gchips::-webkit-scrollbar { display: none; }
.gchips .chip { flex: none; white-space: nowrap; min-height: 38px; padding: 6px 14px; }
.results .nm { display: grid; gap: 2px; min-width: 0; }
.results .nm small { font-size: .8rem; color: var(--muted); }
.results .kk { text-align: right; flex: none; font-weight: 600; font-variant-numeric: tabular-nums; }
.results .kk small { display: block; font-weight: 400; font-size: .72rem; color: var(--muted); }
.rec .label { display: flex; align-items: center; gap: 6px; }
.rec .label svg { width: 16px; height: 16px; }
@media (prefers-reduced-motion: no-preference) {
  .ring-arc { transition: stroke-dashoffset .9s cubic-bezier(.2, .7, .2, 1); }
  .sheet { animation: sheetIn .22s ease-out; }
  @keyframes sheetIn { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
}
/* ---- v5: cajones, tarjetas desplegables, aviso ---- */
.tabs-in { grid-template-columns: repeat(4, 1fr); }
.drawer { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.drawer > summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 68px; cursor: pointer; font-weight: 400; }
.drawer > summary::-webkit-details-marker, .rcard > summary::-webkit-details-marker { display: none; }
.dr-ico { width: 42px; height: 42px; border-radius: 13px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; flex: none; }
.dr-ico svg { width: 22px; height: 22px; }

    var used = {}, usedG = {}; pc.items.forEach(function (it) { used[it.f.id] = 1; if (it.f.g) usedG[it.f.g] = 1; });
    var bb = null;
    L.forEach(function (e) {
      if (used[e.f.id] || (e.f.g && usedG[e.f.g])) return;
      e.o.forEach(function (op) {
        var tot = mSum(pc.tot, op.m);
        if (tot.k > cap) return;
        var c2 = cost(rem, tot) + 2 * ITEM_PEN;
        if (!bb || c2 < bb.cost) bb = { cost: c2, items: pc.items.concat([{ f: e.f, g: op.g, m: op.m }]), tot: tot };
      });
    });
    if (bb && bb.cost < pc.cost - MIN_IMPROVE) cands.push(bb);
  });
  cands.sort(function (p, q) { return p.cost - q.cost; });
  var seen = {}, list = [];
  for (i = 0; i < cands.length && list.length < 3; i++) {
    var key = cands[i].items.map(function (it) { return it.f.id; }).sort().join("|");
    if (seen[key]) continue; seen[key] = 1;
    list.push({ items: cands[i].items, added: cands[i].tot, left: mSub(rem, cands[i].tot), cost: cands[i].cost });
  }
  return { rem: rem, list: list };
}

      h("button", { class: "btn ghost", type: "button", text: "Volver", onclick: draw })
    ]));
  }
  draw();
}
